plugins {
    id 'com.android.application'
}

android {
    // Указываем namespace здесь (современный стандарт вместо package в манифесте)
    namespace 'com.winlator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        // КРИТИЧНО: Поднимаем target до 34, чтобы Android 14/15 корректно выдавал права
        // и правильно обрабатывал foreground-сервисы.
        targetSdkVersion 34 
        versionCode 28
        versionName "11.1"
    }

    // Решение проблемы Duplicate files
    packagingOptions {
        pickFirst '**/*.so'
    }

    buildTypes {
        // Добавлен профиль для релизной сборки
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        // В debug отключаем минификацию, чтобы видеть нормальные стектрейсы при крашах
        debug {
            minifyEnabled false 
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
